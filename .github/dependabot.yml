version: 2
updates:
  - package-ecosystem: pip
    directory: /packages/core
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: pip
    directory: /packages/studio/backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /packages/studio/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
