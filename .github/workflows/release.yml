name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build hiveflow-core
        run: |
          cd packages/core
          python -m build

      - name: Check core package
        run: |
          cd packages/core
          twine check dist/*

      - name: Run core tests
        run: |
          cd packages/core
          pip install -e ".[dev]"
          python -m pytest --cov=hiveflow --cov-fail-under=60

      - name: Publish hiveflow-core to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "Skipping PyPI: PYPI_API_TOKEN secret not configured."
            exit 0
          fi
          cd packages/core
          twine upload dist/*

      - name: Build hiveflow-agent
        run: |
          cd packages/agent
          pip install -e ../core
          python -m build

      - name: Check agent package
        run: |
          cd packages/agent
          twine check dist/*

      - name: Run agent tests
        run: |
          cd packages/agent
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout pytest-cov
          python -m pytest tests/ \
            --ignore=tests/test_real_llm.py \
            --ignore=tests/test_llm_connection.py \
            --cov --cov-fail-under=60

      - name: Publish hiveflow-agent to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "Skipping PyPI: PYPI_API_TOKEN secret not configured."
            exit 0
          fi
          cd packages/agent
          twine upload dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/en/release-notes/v0.1.0.md
          draft: false
          prerelease: true
          files: |
            packages/core/dist/*
            packages/agent/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  studio-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set image version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Set lowercase image prefix
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_PREFIX=ghcr.io/${OWNER}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Studio API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/studio/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/hiveflow-studio-api:${{ env.VERSION }}
            ${{ env.IMAGE_PREFIX }}/hiveflow-studio-api:latest

      - name: Build and push Studio Web image
        uses: docker/build-push-action@v6
        with:
          context: packages/studio/frontend
          file: packages/studio/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/hiveflow-studio-web:${{ env.VERSION }}
            ${{ env.IMAGE_PREFIX }}/hiveflow-studio-web:latest
