name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('packages/core/requirements.txt') }}

      - name: Install dependencies
        run: |
          cd packages/core
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: |
          cd packages/core
          ruff check hiveflow/

      - name: Run Ruff format check
        run: |
          cd packages/core
          ruff format --check hiveflow/

      - name: Run MyPy type checker
        run: |
          cd packages/core
          mypy hiveflow/ || true

      - name: Run tests with coverage
        run: |
          cd packages/core
          python -m pytest --cov=hiveflow --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          file: ./packages/core/coverage.xml
          flags: core

  test-studio:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd packages/studio/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests (excluding polluting test file)
        run: |
          cd packages/studio/backend
          python -m pytest tests/ --ignore=tests/test_api_comprehensive.py -v

      - name: Run comprehensive tests separately
        run: |
          cd packages/studio/backend
          python -m pytest tests/test_api_comprehensive.py -v

  test-agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd packages/agent
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout

      - name: Run tests
        run: |
          cd packages/agent
          python -m pytest tests/ --ignore=tests/test_real_llm.py --ignore=tests/test_llm_connection.py -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: packages/studio/frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('packages/studio/frontend/package-lock.json') }}

      - name: Install dependencies
        run: |
          cd packages/studio/frontend
          npm ci

      - name: Type check
        run: |
          cd packages/studio/frontend
          npx tsc --noEmit

      - name: Lint
        run: |
          cd packages/studio/frontend
          npm run lint || true

      - name: Build
        run: |
          cd packages/studio/frontend
          npm run build
