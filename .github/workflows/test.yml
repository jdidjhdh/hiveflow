name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('packages/core/requirements.txt') }}

      - name: Install dependencies
        run: |
          cd packages/core
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: |
          cd packages/core
          ruff check hiveflow/

      - name: Run Ruff format check
        run: |
          cd packages/core
          ruff format --check hiveflow/

      - name: Run MyPy type checker
        run: |
          cd packages/core
          mypy

      - name: Run tests with coverage
        run: |
          cd packages/core
          python -m pytest --cov=hiveflow --cov-report=xml --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          file: ./packages/core/coverage.xml
          flags: core

  test-studio:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd packages/studio/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests (excluding polluting test file)
        env:
          HIVEFLOW_AGENT_ECHO_LLM: "true"
        run: |
          cd packages/studio/backend
          python -m pytest tests/ --ignore=tests/test_api_comprehensive.py -v \
            --cov=app --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Run Agent API integration tests
        env:
          HIVEFLOW_AGENT_ECHO_LLM: "true"
        run: |
          cd packages/studio/backend
          python -m pytest tests/test_agent_api.py -v --cov=app --cov-append --cov-report=xml

      - name: Run comprehensive tests separately
        env:
          HIVEFLOW_AGENT_ECHO_LLM: "true"
        run: |
          cd packages/studio/backend
          python -m pytest tests/test_api_comprehensive.py -v --cov=app --cov-append \
            --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=60

      - name: Upload Studio backend coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          file: ./packages/studio/backend/coverage.xml
          flags: studio-backend

  test-agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd packages/agent
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout pytest-cov

      - name: Run tests with coverage
        run: |
          cd packages/agent
          python -m pytest tests/ \
            --ignore=tests/test_real_llm.py \
            --ignore=tests/test_llm_connection.py \
            -v --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Upload Agent coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          file: ./packages/agent/coverage.xml
          flags: agent

  test-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd packages/core
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run example smoke tests
        run: python examples/run_smoke_tests.py

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hiveflow core
        run: |
          cd packages/core
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run orchestration benchmarks (quick)
        run: python benchmarks/run_orchestration_latency.py --quick --json benchmarks/last-run-ci.json

      - name: LangGraph adapter tests
        run: |
          cd packages/core
          python -m pytest tests/test_langgraph_adapter.py tests/test_benchmark_sanity.py -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: packages/studio/frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('packages/studio/frontend/package-lock.json') }}

      - name: Install dependencies
        run: |
          cd packages/studio/frontend
          npm ci

      - name: Type check
        run: |
          cd packages/studio/frontend
          npx tsc --noEmit

      - name: Lint
        run: |
          cd packages/studio/frontend
          npm run lint

      - name: Unit tests with coverage
        run: |
          cd packages/studio/frontend
          npm run test:coverage

      - name: Upload Studio frontend coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./packages/studio/frontend/coverage/lcov.info
          flags: studio-frontend

      - name: Build
        run: |
          cd packages/studio/frontend
          npm run build

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Studio backend
        run: |
          cd packages/studio/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd packages/studio/frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        env:
          CI: true
          HIVEFLOW_RUNTIME: agent
          HIVEFLOW_AGENT_ECHO_LLM: "true"
        run: |
          cd packages/studio/frontend
          npm run test:e2e
