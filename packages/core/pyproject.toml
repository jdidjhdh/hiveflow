[project]
name = "hiveflow"
version = "0.1.0"
description = "Lightweight multi-agent orchestration engine with HITL, RAG, MCP, and cognitive planning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "HiveFlow Contributors"},
]
keywords = [
    "ai",
    "multi-agent",
    "llm",
    "orchestration",
    "rag",
    "mcp",
    "human-in-the-loop",
    "workflow",
    "cognitive-planning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.24",
    "aiohttp>=3.8",
    "simpleeval>=0.9",
]

[project.optional-dependencies]
security = [
    "cryptography>=41.0",
    "jsonschema>=4.0",
]
redis = [
    "redis>=5.0",
]
llm = [
    "openai>=1.0",
    "anthropic>=0.18",
]
rag = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]
checkpoint = [
    "aiosqlite>=0.19",
]
all = [
    "hiveflow[security,redis,llm,rag,checkpoint]",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/hiveflow/hiveflow"
Documentation = "https://hiveflow.github.io/hiveflow/"
Repository = "https://github.com/hiveflow/hiveflow"
Issues = "https://github.com/hiveflow/hiveflow/issues"
Changelog = "https://github.com/hiveflow/hiveflow/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["hiveflow", "hiveflow.*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================
# Ruff - Fast Python linter
# ============================================================
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line length (handled by formatter)
    "N818",   # exception name convention
    "RUF001", # CJK punctuation in strings
    "RUF002", # CJK punctuation in docstrings
    "RUF003", # CJK punctuation in comments
]

[tool.ruff.lint.isort]
known-first-party = ["hiveflow"]

[tool.ruff.lint.per-file-ignores]
"hiveflow/__init__.py" = ["I001"]

# ============================================================
# MyPy - Static type checker
# ============================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "skip"
# CI type-check scope: documented public API surface (see docs/en/quality-gates.md)
files = [
    "hiveflow/blackboard.py",
    "hiveflow/bus.py",
    "hiveflow/scheduler.py",
    "hiveflow/cell.py",
    "hiveflow/hitl.py",
    "hiveflow/checkpoint.py",
    "hiveflow/plugin_marketplace.py",
    "hiveflow/orchestrator.py",
    "hiveflow/app.py",
    "hiveflow/guards.py",
    "hiveflow/streaming.py",
    "hiveflow/validation.py",
    "hiveflow/execution.py",
]

[[tool.mypy.overrides]]
module = "hiveflow.app"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hiveflow.cell"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hiveflow.__init__"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hiveflow.scheduler"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hiveflow.llm_client"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hiveflow.guards"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hiveflow.streaming"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hiveflow.validation"
ignore_errors = true

# ============================================================
# Coverage
# ============================================================
[tool.coverage.run]
source = ["hiveflow"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_empty = true

# ============================================================
# Pytest - Test runner
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
timeout = 60
asyncio_mode = "strict"
