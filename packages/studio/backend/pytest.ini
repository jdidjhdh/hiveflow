[pytest]
asyncio_mode = auto
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning

addopts =
    --strict-markers
    -ra

# Coverage (used when --cov is passed on CLI or in CI)
[coverage:run]
source = app
omit =
    */tests/*

[coverage:report]
fail_under = 60
show_missing = true
skip_covered = true
