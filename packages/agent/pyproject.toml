[project]
name = "hiveflow-agent"
version = "0.1.0"
description = "HiveFlow Agent Runtime — ReAct workers and cognitive orchestration on hiveflow core"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "hiveflow-core>=0.1.0",
    "aiohttp>=3.8,<3.14",
    "aioresponses>=0.7",
    "openai>=1.0",
    "anthropic>=0.18",
    "httpx>=0.24",
    "cryptography>=41.0",
    "chromadb>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/jdidjhdh/hiveflow"
Documentation = "https://jdidjhdh.github.io/hiveflow/"
Repository = "https://github.com/jdidjhdh/hiveflow"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "worker*", "llm*", "memory*", "orchestrator*", "guardrails*"]

[tool.setuptools]
py-modules = ["app", "demo", "protocol", "intent_parser"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "real_llm: optional integration tests against a live LLM (excluded from CI)",
]

[tool.coverage.run]
source = [
    "app",
    "core",
    "orchestrator",
    "worker",
    "llm",
    "memory",
    "guardrails",
    "intent_parser",
    "protocol",
    "replay",
    "mcp_skills",
]
omit = ["demo.py", "tests/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "RUF"]
ignore = ["E501", "E402", "N818", "N806", "RUF012", "F841", "RUF013", "RUF001", "RUF002", "RUF003", "UP006", "UP035", "UP037", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["core", "worker", "llm", "memory", "orchestrator", "guardrails"]

[tool.ruff.lint.per-file-ignores]
"llm/provider_factory.py" = ["F401"]
"app.py" = ["F401"]
"memory/manager.py" = ["F401"]
