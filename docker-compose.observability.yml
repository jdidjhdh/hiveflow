# Optional Grafana Tempo stack (use with Jaeger or instead of Jaeger)
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#   export HIVEFLOW_OTEL_ENABLED=1
#   export OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318

version: "3.8"

services:
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./packages/core/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo query
      - "4318:4318"   # OTLP HTTP (conflicts with Jaeger if both exposed — use profile)

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - tempo

  studio:
    environment:
      - HIVEFLOW_OTEL_ENABLED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      - HIVEFLOW_TEMPO_URL=http://localhost:3200

volumes:
  tempo_data:
  grafana_data:
