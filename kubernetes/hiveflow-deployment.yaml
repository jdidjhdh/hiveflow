# ==============================================
# HiveFlow - Kubernetes 部署配置
# ==============================================
# 包含以下组件：
# - hiveflow-studio: 可视化编排平台后端
# - hiveflow-studio-frontend: 前端 Web 界面
# - hiveflow-agent: Agent 运行时
# - hiveflow-core: 核心引擎
# - Redis: 缓存/黑板后端（可选）
# - PostgreSQL: 数据库（可选）
# ==============================================

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: hiveflow
  labels:
    name: hiveflow

---
# ==============================================
# ConfigMap - 通用配置
# ==============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: hiveflow-config
  namespace: hiveflow
data:
  # 后端配置
  HIVEFLOW_API_PORT: "8000"
  HIVEFLOW_WS_PORT: "8000"
  REDIS_URL: "redis://hiveflow-redis:6379"
  DB_URL: "postgresql://hiveflow:hiveflow@hiveflow-db:5432/hiveflow"

  # Agent 配置
  AGENT_MAX_CONCURRENT: "10"
  AGENT_SCHEDULER_STRATEGY: "least_loaded"
  AGENT_HITL_TIMEOUT: "300"

  # LLM 配置
  LLM_DEFAULT_PROVIDER: "openai"
  LLM_DEFAULT_MODEL: "gpt-4o"
  LLM_TEMPERATURE: "0.2"
  LLM_MAX_TOKENS: "4096"

  # 安全配置
  HIVEFLOW_ENCRYPTION_KEY: "${HIVEFLOW_ENCRYPTION_KEY}"
  GUARD_ENABLED: "true"
  GUARD_MAX_INPUT_LENGTH: "10000"

---
# ==============================================
# Secret - 敏感配置
# ==============================================
apiVersion: v1
kind: Secret
metadata:
  name: hiveflow-secrets
  namespace: hiveflow
type: Opaque
stringData:
  # 请在部署前替换为实际值
  OPENAI_API_KEY: "your-openai-api-key"
  ANTHROPIC_API_KEY: "your-anthropic-api-key"
  POSTGRES_PASSWORD: "hiveflow-secure-password"
  REDIS_PASSWORD: "hiveflow-redis-password"
  HIVEFLOW_ENCRYPTION_KEY: "your-encryption-key-min-32-chars"

---
# ==============================================
# Redis 部署
# ==============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hiveflow-redis
  namespace: hiveflow
  labels:
    app: hiveflow-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hiveflow-redis
  template:
    metadata:
      labels:
        app: hiveflow-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          command: ["redis-server", "--appendonly", "yes", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hiveflow-secrets
                  key: REDIS_PASSWORD
      volumes:
        - name: redis-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: hiveflow-redis
  namespace: hiveflow
spec:
  selector:
    app: hiveflow-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP

---
# ==============================================
# PostgreSQL 部署
# ==============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hiveflow-db
  namespace: hiveflow
  labels:
    app: hiveflow-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hiveflow-db
  template:
    metadata:
      labels:
        app: hiveflow-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "hiveflow"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hiveflow-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "hiveflow"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "hiveflow"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: postgres-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: hiveflow-db
  namespace: hiveflow
spec:
  selector:
    app: hiveflow-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
# ==============================================
# HiveFlow Studio 后端部署
# ==============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hiveflow-studio
  namespace: hiveflow
  labels:
    app: hiveflow-studio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hiveflow-studio
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hiveflow-studio
    spec:
      containers:
        - name: studio
          image: hiveflow/hiveflow-studio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8000
              name: ws
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hiveflow-secrets
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hiveflow-secrets
                  key: ANTHROPIC_API_KEY
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: hiveflow-config
                  key: REDIS_URL
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: hiveflow-config
                  key: DB_URL
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hiveflow-studio
  namespace: hiveflow
  labels:
    app: hiveflow-studio
spec:
  selector:
    app: hiveflow-studio
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: ws
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
# ==============================================
# HiveFlow Studio 前端部署
# ==============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hiveflow-frontend
  namespace: hiveflow
  labels:
    app: hiveflow-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hiveflow-frontend
  template:
    metadata:
      labels:
        app: hiveflow-frontend
    spec:
      containers:
        - name: frontend
          image: hiveflow/hiveflow-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_BASE_URL
              value: "http://hiveflow-studio:8000"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: hiveflow-frontend
  namespace: hiveflow
spec:
  selector:
    app: hiveflow-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

---
# ==============================================
# HiveFlow Agent 部署
# ==============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hiveflow-agent
  namespace: hiveflow
  labels:
    app: hiveflow-agent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hiveflow-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hiveflow-agent
    spec:
      containers:
        - name: agent
          image: hiveflow/hiveflow-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hiveflow-secrets
                  key: OPENAI_API_KEY
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: hiveflow-config
                  key: REDIS_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
# ==============================================
# Ingress
# ==============================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hiveflow-ingress
  namespace: hiveflow
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "hiveflow-studio"
spec:
  rules:
    - host: hiveflow.example.com
      http:
        paths:
          # API 请求路由到后端
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hiveflow-studio
                port:
                  number: 8000
          # WebSocket 路由到后端
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: hiveflow-studio
                port:
                  number: 8000
          # 其他请求路由到前端
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hiveflow-frontend
                port:
                  number: 80

---
# ==============================================
# Horizontal Pod Autoscaler (HPA)
# ==============================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hiveflow-studio-hpa
  namespace: hiveflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hiveflow-studio
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hiveflow-agent-hpa
  namespace: hiveflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hiveflow-agent
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
