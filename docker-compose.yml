# ==============================================
# HiveFlow - Docker Compose 开发环境
# ==============================================
# 用于本地开发和测试
# ==============================================

version: "3.8"

services:
  # ==============================================
  # Redis - 缓存/黑板后端
  # ==============================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================
  # PostgreSQL - 数据库
  # ==============================================
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hiveflow
      POSTGRES_PASSWORD: hiveflow
      POSTGRES_DB: hiveflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hiveflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================
  # Jaeger - OTLP trace backend (A3)
  # ==============================================
  jaeger:
    image: jaegertracing/all-in-one:1.62
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP HTTP
      - "4317:4317"     # OTLP gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # ==============================================
  # HiveFlow Studio 后端
  # ==============================================
  studio:
    build:
      context: .
      dockerfile: packages/studio/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgresql://hiveflow:hiveflow@postgres:5432/hiveflow
      - HIVEFLOW_RUNTIME=agent
      - HIVEFLOW_PLAN_HITL=true
      - HIVEFLOW_AGENT_ECHO_LLM=true
      - HIVEFLOW_OTEL_ENABLED=${HIVEFLOW_OTEL_ENABLED:-0}
      - OTEL_SERVICE_NAME=hiveflow-studio
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - HIVEFLOW_JAEGER_UI_URL=http://localhost:16686
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      - ./packages/studio/backend:/app
      - ./packages/core:/packages/core
      - ./packages/agent:/packages/agent
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ==============================================
  # HiveFlow Studio 前端
  # ==============================================
  frontend:
    build:
      context: ./packages/studio/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - studio

  # ==============================================
  # HiveFlow Agent
  # ==============================================
  agent:
    build:
      context: ./packages/agent
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      redis:
        condition: service_healthy

  # ==============================================
  # HiveFlow Core
  # ==============================================
  core:
    build:
      context: ./packages/core
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgresql://hiveflow:hiveflow@postgres:5432/hiveflow
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
